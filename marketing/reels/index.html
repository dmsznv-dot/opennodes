<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>OpenNodes reels</title>
    <link rel="stylesheet" href="kit.css" />
  </head>
  <body>
    <div id="stage"></div>
    <script src="kit.js"></script>
    <script>
      // ?reel=3 loads reels/reel03.js; ?reel=3&play plays it in real time for a preview.
      const q = new URLSearchParams(location.search);
      const n = String(q.get('reel') ?? '1').padStart(2, '0');
      const s = document.createElement('script');
      s.src = `reels/reel${n}.js`;
      s.onload = () => {
        if (!q.has('play')) return;
        const t0 = performance.now();
        const loop = () => {
          window.renderAt(((performance.now() - t0) / 1000) % window.REEL_DURATION);
          requestAnimationFrame(loop);
        };
        loop();
      };
      document.body.append(s);
    </script>
  </body>
</html>
