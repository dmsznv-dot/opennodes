  <rect x="1" y="1" width="518" height="94" rx="12" fill="#090a0b" stroke="#22262c" stroke-width="2"/>

  <!-- Left Icon Container -->
  <g transform="translate(16, 16)">
    <rect x="2" y="2" width="60" height="60" rx="12" fill="#121417" stroke="#22262c" stroke-width="2"/>
    <path d="M22 22H32V20H40" stroke="#333942" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M22 22H28V42H40" stroke="#3b82f6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M45 26V36" stroke="#333942" stroke-width="1.5" stroke-dasharray="2 2"/>

    <!-- Trigger Node -->
    <rect x="12" y="15" width="14" height="14" rx="4" fill="#1a1d21" stroke="#f59e0b" stroke-width="2"/>
