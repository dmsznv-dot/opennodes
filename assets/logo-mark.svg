<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- OpenNodes Geometric Mark — Unslop Ink/Graphite + Electric Cobalt -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#090a0b" stroke="#22262c" stroke-width="2"/>
  <rect x="6" y="6" width="52" height="52" rx="8" fill="#121417" stroke="#1a1d21" stroke-width="1"/>

  <!-- Subtle 8px Technical Grid Marks -->
  <path d="M16 14H48M16 50H48" stroke="#1a1d21" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Orthogonal DAG Edges -->
  <path d="M22 22H32V20H40" stroke="#333942" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M22 22H28V42H40" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M44 24V38" stroke="#333942" stroke-width="1.5" stroke-dasharray="2 2"/>

  <!-- Root Trigger Node (Top-Left) -->
  <rect x="12" y="15" width="14" height="14" rx="4" fill="#1a1d21" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="19" cy="22" r="2.5" fill="#f59e0b"/>

  <!-- Branch Node A (Top-Right) -->
  <rect x="38" y="13" width="14" height="14" rx="4" fill="#1a1d21" stroke="#333942" stroke-width="2"/>
  <circle cx="45" cy="20" r="2.5" fill="#cbd1dc"/>

  <!-- Primary Active Execution Node (Bottom-Right — Electric Cobalt) -->
  <rect x="38" y="35" width="14" height="14" rx="4" fill="#1a1d21" stroke="#3b82f6" stroke-width="2"/>
  <rect x="42" y="39" width="6" height="6" rx="1.5" fill="#3b82f6"/>

  <!-- Checkpoint Status Indicator (Bottom-Left) -->
  <rect x="14" y="39" width="8" height="6" rx="2" fill="#10b981"/>
</svg>
